{% extends "base.html" %}{% set title = "Welcome" %}
{% block body %}
<h1>Welcome to ApplyPeace</h1>
<p class="muted">A few minutes of setup, once. Nothing is scanned or sent until you finish. You can pause and come back any time.</p>
<form method="post" action="/setup/choices">
<input type="hidden" name="_token" value="{{ token }}">

<h2>AI help</h2>
<label class="choice"><input type="radio" name="llm_consent" value="yes" {{ 'checked' if settings.llm.consent }}>
<span>Yes, use Claude <span class="hint">to read your resume, pick jobs and draft essay answers. Your resume and job descriptions are sent to Anthropic through your Claude Code account.</span></span></label>
<label class="choice"><input type="radio" name="llm_consent" value="no" {{ 'checked' if not settings.llm.consent }}>
<span>No AI <span class="hint">You fill in details yourself; jobs are ranked by keywords only.</span></span></label>

<h2>Submitting</h2>
<label class="choice"><input type="radio" name="submit_mode" value="fill_only" {{ 'checked' if settings.submit_mode != 'auto' }}>
<span>Fill only, I click Submit <span class="hint">Safest start. Switch to automatic later.</span></span></label>
<label class="choice"><input type="radio" name="submit_mode" value="auto" {{ 'checked' if settings.submit_mode == 'auto' }}>
<span>Submit automatically after I approve <span class="hint">Only jobs you approved, with the exact answers you saw.</span></span></label>

<h2>Visa sponsorship</h2>
<label class="choice"><input type="checkbox" name="h1b_filter" value="yes" {{ 'checked' if settings.h1b_filter }}>
<span>Only show US jobs at employers with an H-1B record <span class="hint">and skip postings that say they won't sponsor.</span></span></label>

<h2>Backup</h2>
<label class="choice"><input type="checkbox" name="backup" value="yes" {{ 'checked' if settings.backup_requested }}>
<span>Back up my data to a private GitHub repo <span class="hint">Your data is always versioned locally. A backup is only created after you confirm it separately.</span></span></label>

<div class="bar"><div class="inner"><button type="submit">Continue</button></div></div>
</form>
{% endblock %}
